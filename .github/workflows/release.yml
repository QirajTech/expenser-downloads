# Builds the Expenser desktop installers from the private code repo and publishes them here,
# replacing the previous release so only the latest version exists (Expenser DECISIONS D80).
#
# Started by hand (Actions → Release → Run workflow, or `gh workflow run release.yml
# --repo QirajTech/expenser-downloads -f tag=v1.6.0`), and once a day it looks for a newer
# version tag in the code repo and builds it if it has no release here yet.
#
# Reads the code with SOURCE_DEPLOY_KEY, a read-only deploy key on QirajTech/expenser.
# Publishes with this repo's own token; no personal token is involved.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag in the code repo, e.g. v1.6.0 (empty = the newest)"
        required: false
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      build: ${{ steps.pick.outputs.build }}
    steps:
      - name: Pick the version to build
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ secrets.SOURCE_DEPLOY_KEY }}
          WANTED: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && printf '%s\n' "$KEY" > ~/.ssh/source_key && chmod 600 ~/.ssh/source_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/source_key -o StrictHostKeyChecking=accept-new"
          newest=$(git ls-remote --tags --refs git@github.com:QirajTech/expenser.git 'v*' \
            | sed 's#.*refs/tags/##' | sort -V | tail -1)
          tag="${WANTED:-$newest}"
          if [ -z "$tag" ]; then echo "No version tag found."; echo "build=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # A run started by hand always builds; the daily check only builds a version not published yet.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "Building $tag."
          else
            echo "build=false" >> "$GITHUB_OUTPUT"; echo "$tag is already published."
          fi

  build:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            task: packageExe
            pattern: "app/desktopApp/build/compose/binaries/main/exe/*.exe"
            name: Expenser-windows-x64.exe
          - os: macos-15
            task: packageDmg
            pattern: "app/desktopApp/build/compose/binaries/main/dmg/*.dmg"
            name: Expenser-macos-apple-silicon.dmg
          - os: macos-15-intel
            task: packageDmg
            pattern: "app/desktopApp/build/compose/binaries/main/dmg/*.dmg"
            name: Expenser-macos-intel.dmg
          - os: ubuntu-latest
            task: packageDeb
            pattern: "app/desktopApp/build/compose/binaries/main/deb/*.deb"
            name: Expenser-linux-x64.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: QirajTech/expenser
          ref: ${{ needs.resolve.outputs.tag }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot
      - name: Windows packaging tools (WiX 3, needed by jpackage on JDK 17)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --version 3.14.1 -y --no-progress
            Add-Content $env:GITHUB_PATH "C:\Program Files (x86)\WiX Toolset v3.14\bin"
          }
      - name: Build installer
        working-directory: app
        shell: bash
        run: ./gradlew :desktopApp:${{ matrix.task }} --no-daemon --quiet
      - name: Give it its fixed name
        shell: bash
        run: |
          mkdir -p out
          cp ${{ matrix.pattern }} "out/${{ matrix.name }}"
      - name: Linux portable archive
        if: runner.os == 'Linux'
        shell: bash
        run: |
          (cd app && ./gradlew :desktopApp:createDistributable --no-daemon --quiet)
          tar -C app/desktopApp/build/compose/binaries/main/app -czf out/Expenser-linux-x64.tar.gz Expenser
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/*
          retention-days: 3

  publish:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Replace the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          ls -la out
          version="${TAG#v}"
          # Keep the latest version only: remove every earlier release and its tag.
          for old in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName'); do
            gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done
          gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" --latest --target main \
            --title "Expenser $version" \
            --notes "Expenser $version for Windows, macOS and Linux. Android is on Google Play. Get it at https://expenser.qiraj.com/#download"
